spring:
  application:
    name: gongbang-backend

  # 내 컴퓨터 전용 메일 계정 파일 (깃에 안 올라감). backend/mail.properties 에 아이디·비밀번호만 적으면 인증번호가 메일로 간다
  # 서버를 어느 폴더에서 켜도 찾도록 backend 폴더·저장소 폴더·내 홈(~/.gongbang)을 모두 본다
  # 테스트 서버는 이 파일을 쓰지 않는다: systemd(gongbang-backend@blue/green)가 /srv/gongbang/deploy/backend.env 의 MAIL_* 를 넣는다
  config:
    import: "optional:file:./mail.properties,optional:file:./backend/mail.properties,optional:file:./Gongbang/backend/mail.properties,optional:file:${user.home}/.gongbang/mail.properties"

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gongbang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100
        highlight_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  # MY-01 프로필 사진 5MB (서버에서 5MB를 넘으면 친절한 문구로 막고, 그보다 훨씬 큰 요청만 여기서 끊는다)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    time-zone: Asia/Seoul
    locale: ko_KR

  # NOTI-06 메일 (SMTP 값은 환경 변수로만. MAIL_HOST가 비어 있으면 보내지 못한다 → 인증번호는 app.mail-dev-code 참고)
  # 테스트 서버: /srv/gongbang/deploy/backend.env (새 키가 필요하면 서버 관리자에게 요청). Gmail 앱 비밀번호는 공백 포함 그대로 따옴표로 감싸도 된다
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  crawler:
    internal-key: ${CRAWLER_INTERNAL_KEY:}
  # WS-06, DOC-08·DOC-10·WB-10 문서·보드 동기화 서버(Node). 키·주소는 환경 변수로만
  # 키가 비어 있으면 /internal/documents·whiteboards 요청은 모두 401, 주소나 키가 비어 있으면 끊기 요청을 보내지 않는다
  sync:
    internal-key: ${SYNC_INTERNAL_KEY:}
    server-url: ${SYNC_SERVER_URL:}
    connect-timeout: 1s
    read-timeout: 2s
  # AUTH-01 로그인 토큰. JWT_SECRET은 32바이트 이상 (비어 있으면 서버가 켜질 때마다 임시 키를 만든다 — 로컬 개발용)
  jwt:
    secret: ${JWT_SECRET:}
    access-minutes: 30
    refresh-days: 1
    remember-me-days: 30
  # AUTH-10 간편 로그인. 키는 환경 변수로만 (비어 있으면 그 버튼은 「준비 중」)
  # 각 개발자 콘솔에 등록할 Redirect URI: {백엔드 주소}/login/oauth2/code/kakao , .../google
  oauth:
    redirect-uri-template: ${OAUTH_REDIRECT_URI_TEMPLATE:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      # 이메일을 받으려면 account_email (카카오 비즈 앱 전환 필요, AUTH-10 비고). 비우면 이메일은 직접 입력·인증
      scope: ${KAKAO_SCOPE:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  # MY-08 실명 AES 암호화 키 (16·24·32바이트)
  crypto:
    real-name-key: ${REAL_NAME_KEY:}
  # 메일 링크·OAuth 콜백에 쓰는 프론트 주소
  front-base-url: ${FRONT_BASE_URL:http://localhost:5173}
  # 보내는 사람 주소. 비우면 MAIL_USERNAME(이메일 형식일 때)을 쓴다
  mail-from: ${MAIL_FROM:}
  # MY-01 프로필 사진을 저장하는 폴더 (깃에 안 올라감). 배포 서버에서는 지워지지 않는 경로로
  upload-dir: ${UPLOAD_DIR:./uploads}
  # 로컬 개발: MAIL_HOST가 비어 있으면 인증번호를 메일 대신 화면에 보여 준다. 배포 서버에서는 꼭 MAIL_DEV_CODE=false
  # 기본은 꺼짐: 메일 설정이 없으면 화면에 번호를 채우지 않고 「메일을 보내지 못했어요」로 알린다
  mail-dev-code: ${MAIL_DEV_CODE:false}
