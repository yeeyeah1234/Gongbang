<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title>
<style>@media only screen and (max-width:600px){.shell{padding:16px 12px!important}.inset{padding-left:24px!important;padding-right:24px!important}.headline{font-size:26px!important}.brandbar{padding-top:24px!important;padding-bottom:24px!important}}</style>
</head>
<body style="margin:0;padding:0;background:#f5f7fa;color:#202b3b;font-family:'Malgun Gothic',AppleSDGothicNeo,Arial,sans-serif;-webkit-text-size-adjust:100%">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7fa"><tr><td align="center" class="shell" style="padding:40px 20px">
<!--[if mso]><table role="presentation" width="600"><tr><td><![endif]-->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #e7ebf0;border-radius:8px">
<tr><td class="inset brandbar" style="padding:28px 40px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td>{{brand}}</td><td align="right" style="font-size:11px;color:#788391;letter-spacing:1px">공방에서<br><span style="line-height:2">보낸 소식</span></td></tr></table></td></tr>
<tr><td class="inset" style="padding:0 40px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td width="48" height="3" bgcolor="#ff6b2b"></td><td bgcolor="#edf0f4"></td></tr></table></td></tr>
<tr><td class="inset" style="padding:36px 40px 32px;word-break:break-word;overflow-wrap:anywhere">
<p style="margin:0 0 12px;color:#ba4715;font-size:12px;font-weight:700;letter-spacing:1px">{{category}}</p>
<h1 class="headline" style="margin:0 0 28px;font-size:30px;line-height:1.45;letter-spacing:-1px;font-weight:700;color:#202b3b">{{heading}}</h1>
{{code}}
<div style="font-size:15px;line-height:1.9;color:#637083">{{body}}</div>
{{action}}
</td></tr>
<tr><td class="inset" style="padding:0 40px 28px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td style="border-top:1px solid #edf0f4;padding-top:20px;font-size:12px;line-height:1.9;color:#7b8490;word-break:break-word">{{footer}}</td></tr></table></td></tr>
<tr><td class="inset" style="padding:20px 40px;background:#fafbfc;border-top:1px solid #edf0f4;border-radius:0 0 8px 8px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td style="font-size:13px;font-weight:700;color:#5b687a">공방</td><td align="right" style="font-size:11px;color:#8a94a2">함께 도전하는 공간</td></tr></table></td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table>
</body></html>
