<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title>
<style>@media only screen and (max-width:600px){.shell{padding:24px 16px!important}.content{padding:32px 24px!important}.headline{font-size:28px!important;line-height:1.4!important}.brandbar{padding:0 8px 20px!important}}</style>
</head>
<body style="margin:0;padding:0;background:#f4f2ee;color:#182b44;font-family:'Malgun Gothic',AppleSDGothicNeo,Arial,sans-serif;-webkit-text-size-adjust:100%">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f2ee"><tr><td align="center" class="shell" style="padding:48px 20px">
<!--[if mso]><table role="presentation" width="600"><tr><td><![endif]-->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px">
<tr><td class="brandbar" style="padding:0 12px 24px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td>{{brand}}</td><td align="right" style="font-size:11px;letter-spacing:2px;font-weight:700;color:#7b7e81">함께 만드는<br><span style="letter-spacing:0;line-height:2">새로운 가능성</span></td></tr></table></td></tr>
<tr><td class="content" style="padding:44px 40px;background:#ffffff;border-radius:20px;word-break:break-word;overflow-wrap:anywhere">
<p style="margin:0 0 24px"><span style="display:inline-block;padding:6px 10px;background:#fff0e6;border-radius:6px;color:#a13e12;font-size:12px;font-weight:700;letter-spacing:0.5px">{{category}}</span></p>
<h1 class="headline" style="margin:0 0 28px;font-size:32px;line-height:1.4;letter-spacing:-1.2px;font-weight:700;color:#182b44">{{heading}}</h1>
{{code}}
<div style="font-size:15px;line-height:1.9;color:#576273">{{body}}</div>
{{action}}
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin-top:32px"><tr><td style="padding-top:20px;border-top:1px solid #eceef0;font-size:12px;line-height:1.8;color:#7b8490">{{footer}}</td></tr></table>
</td></tr>
<tr><td style="padding:24px 12px 0;font-size:12px;line-height:1.9;color:#85878a;text-align:center">도전을 시작하고, 함께 완성하는 곳.<br><strong style="font-size:12px;font-weight:700;color:#5f6771">공방</strong><span style="color:#b5b7ba"> &nbsp; / &nbsp; </span>공모전 작업방</td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table>
</body></html>
